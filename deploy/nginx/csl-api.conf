# ============================================================
#  Nginx 反向代理配置 — 中超预测后端 HTTPS
#
#  部署步骤：
#    1. 把此文件复制到 /etc/nginx/sites-available/csl-api
#    2. ln -s /etc/nginx/sites-available/csl-api /etc/nginx/sites-enabled/
#    3. 修改下方的 your-domain.com 为你的真实域名
#    4. 用 certbot 申请 Let's Encrypt 免费证书（见下方命令）
#    5. nginx -t && systemctl reload nginx
#
#  Let's Encrypt 证书申请：
#    # 先安装 certbot：
#    apt install certbot python3-certbot-nginx   # Ubuntu/Debian
#    yum install certbot python3-certbot-nginx   # CentOS
#    # 一键申请 + 自动配置 Nginx：
#    certbot --nginx -d api.your-domain.com
#    # certbot 会自动修改此文件，在 server 块里加入 SSL 证书路径
# ============================================================

# HTTP → HTTPS 强制跳转（certbot 会自动处理，这里也手动写一份）
server {
    listen 80;
    server_name api.your-domain.com;   # ← 改成你的域名

    # Let's Encrypt 验证目录（certbot 需要访问）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余全部 301 跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name api.your-domain.com;   # ← 改成你的域名

    # ---- SSL 证书 ----
    # 方式 A：Let's Encrypt（推荐，免费，certbot --nginx 会自动填入）
    # ssl_certificate     /etc/letsencrypt/live/api.your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.your-domain.com/privkey.pem;

    # 方式 B：手动证书（从阿里云/腾讯云/其他 CA 购买）
    # ssl_certificate     /etc/nginx/ssl/csl-api.pem;
    # ssl_certificate_key /etc/nginx/ssl/csl-api.key;

    # ---- SSL 安全参数（最佳实践） ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS（告诉浏览器以后只走 HTTPS，可选但推荐）
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ---- 安全头（小程序审核加分项） ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ---- 反向代理到 Gunicorn ----
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时：实时接口可能外呼 API-Football，稍长些
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # ---- 健康检查不走代理（方便 Nginx 层面监控） ----
    location /api/health {
        proxy_pass http://127.0.0.1:5001;
        access_log off;   # 健康检查日志不记录，减少磁盘写入
    }

    # ---- 静态文件缓存（如果后续加前端静态资源） ----
    # location /static/ {
    #     alias /path/to/your/static/files/;
    #     expires 7d;
    # }
}
