# ============================================================
#  Nginx 配置 — 三域名分流（模板）
#
#  部署前请将所有 your-domain.com 替换为你的真实域名。
#
#  football.your-domain.com  → Vue 前端网页版
#  weixin.your-domain.com    → 微信小程序后端 API（根路径 404）
#  your-domain.com           → 静默断开（审核员无法访问）
# ============================================================

# ==================== football.your-domain.com ====================

# HTTP → HTTPS
server {
    listen 80;
    server_name football.your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：前端 + API 代理
server {
    listen 443 ssl;
    http2 on;
    server_name football.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/football.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/football.your-domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /var/www/csl-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }
}

# ==================== weixin.your-domain.com ====================

# HTTP → HTTPS
server {
    listen 80;
    server_name weixin.your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：小程序 API 专用，根路径 404
server {
    listen 443 ssl;
    http2 on;
    server_name weixin.your-domain.com;

    # 同一 SAN 证书覆盖两个子域名
    ssl_certificate     /etc/letsencrypt/live/football.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/football.your-domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 根路径 404，审核员访问看不到任何页面
    location / {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }
}

# ==================== your-domain.com ====================

# HTTP：Let's Encrypt 续期验证保留，其余静默断开
server {
    listen 80;
    server_name your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余请求全部 444（静默断开连接，不泄露服务器信息）
    location / {
        return 444;
    }
}

# HTTPS：主域名整站静默断开，审核员无法访问任何内容
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}
